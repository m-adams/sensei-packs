name: eep-grade-search-query
enabled: true
description: >-
  Grade Searching Data exercises by executing the learner's stored search template
  against the lab index and validating results. Canonical mode runs the learner's
  eep-canonical-search template with {search_term: "query", category: "search"}
  and expects >=1 hit. Challenge mode runs the learner's eep-beginner-filter
  template with {difficulty: "beginner"} and expects exactly 2 hits sorted by
  points descending (first_points = 20).
tags: ["elastic-engineer-prep"]

triggers:
  - type: manual

inputs:
  - name: mode
    type: string
    required: true
  - name: index_name
    type: string
    required: false

steps:
  - name: route_mode
    type: if
    condition: "${{ inputs.mode == 'canonical' }}"
    steps:
      - name: run_canonical
        type: elasticsearch.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/{{ inputs.index_name | default: 'eep-search-lab-demo' }}/_search/template"
          body:
            id: "eep-canonical-search"
            params:
              search_term: "query"
              category: "search"

      - name: canonical_error_check
        type: if
        condition: "${{ steps.run_canonical.error.message.size > 0 }}"
        steps:
          - name: finalize_canonical_error
            type: elasticsearch.request
            with:
              method: POST
              path: "/_query"
              body:
                query: |-
                  ROW passed = false, mode = "canonical", hits_count = 0, first_points = 0, template_id = "eep-canonical-search", hints_json = "[\"Could not execute template eep-canonical-search. Run GET _scripts/eep-canonical-search to check it exists. If missing, re-run the PUT _scripts command.\"]", error_snippet = "{{ steps.run_canonical.error.message }}"
        else:
          - name: canonical_check_hits
            type: if
            condition: "${{ steps.run_canonical.output.hits.total.value >= 1 }}"
            steps:
              - name: finalize_canonical_pass
                type: elasticsearch.request
                with:
                  method: POST
                  path: "/_query"
                  body:
                    query: |-
                      ROW passed = true, mode = "canonical", hits_count = {{ steps.run_canonical.output.hits.total.value }}, first_points = {{ steps.run_canonical.output.hits.hits[0]._source.points }}, template_id = "eep-canonical-search", hints_json = "[]", error_snippet = ""
            else:
              - name: finalize_canonical_no_hits
                type: elasticsearch.request
                with:
                  method: POST
                  path: "/_query"
                  body:
                    query: |-
                      ROW passed = false, mode = "canonical", hits_count = 0, first_points = 0, template_id = "eep-canonical-search", hints_json = "[\"Template executed but returned 0 hits. Check your must clause matches on the title field, and your filters restrict to published:true and the category param.\"]", error_snippet = ""
    else:
      - name: route_challenge
        type: if
        condition: "${{ inputs.mode == 'challenge' }}"
        steps:
          - name: run_challenge
            type: elasticsearch.request
            on-failure:
              continue: true
            with:
              method: POST
              path: "/{{ inputs.index_name | default: 'eep-search-lab-demo' }}/_search/template"
              body:
                id: "eep-beginner-filter"
                params:
                  difficulty: "beginner"

          - name: challenge_error_check
            type: if
            condition: "${{ steps.run_challenge.error.message.size > 0 }}"
            steps:
              - name: finalize_challenge_error
                type: elasticsearch.request
                with:
                  method: POST
                  path: "/_query"
                  body:
                    query: |-
                      ROW passed = false, mode = "challenge", hits_count = 0, first_points = 0, template_id = "eep-beginner-filter", hints_json = "[\"Could not execute template eep-beginner-filter. Run GET _scripts/eep-beginner-filter to check it exists. If missing, create it with PUT _scripts/eep-beginner-filter.\"]", error_snippet = "{{ steps.run_challenge.error.message }}"
            else:
              - name: challenge_check_count
                type: if
                condition: "${{ steps.run_challenge.output.hits.total.value == 2 }}"
                steps:
                  - name: challenge_check_sort
                    type: if
                    condition: "${{ steps.run_challenge.output.hits.hits[0]._source.points == 20 }}"
                    steps:
                      - name: finalize_challenge_pass
                        type: elasticsearch.request
                        with:
                          method: POST
                          path: "/_query"
                          body:
                            query: |-
                              ROW passed = true, mode = "challenge", hits_count = {{ steps.run_challenge.output.hits.total.value }}, first_points = {{ steps.run_challenge.output.hits.hits[0]._source.points }}, template_id = "eep-beginner-filter", hints_json = "[]", error_snippet = ""
                    else:
                      - name: finalize_wrong_sort
                        type: elasticsearch.request
                        with:
                          method: POST
                          path: "/_query"
                          body:
                            query: |-
                              ROW passed = false, mode = "challenge", hits_count = {{ steps.run_challenge.output.hits.total.value }}, first_points = {{ steps.run_challenge.output.hits.hits[0]._source.points }}, template_id = "eep-beginner-filter", hints_json = "[\"2 beginner docs found but sort order is wrong — first hit should have points=20. Add sort: [{points: desc}] to your template source.\"]", error_snippet = ""
                else:
                  - name: finalize_wrong_count
                    type: elasticsearch.request
                    with:
                      method: POST
                      path: "/_query"
                      body:
                        query: |-
                          ROW passed = false, mode = "challenge", hits_count = {{ steps.run_challenge.output.hits.total.value }}, first_points = 0, template_id = "eep-beginner-filter", hints_json = "[\"Expected 2 beginner docs but got {{ steps.run_challenge.output.hits.total.value }}. Use a bool filter with term on the difficulty param and published: true.\"]", error_snippet = ""
        else:
          - name: finalize_invalid_mode
            type: elasticsearch.request
            with:
              method: POST
              path: "/_query"
              body:
                query: |-
                  ROW passed = false, mode = "invalid", hits_count = 0, first_points = 0, template_id = "", hints_json = "[\"mode must be canonical or challenge.\"]", error_snippet = ""
